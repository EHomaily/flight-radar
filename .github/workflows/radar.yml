name: Flight Radar

on:
  schedule:
    # يومياً 06:14 صباحاً بتوقيت الرياض (03:14 UTC). لإضافة تشغيل مسائي أضف سطراً مثل: - cron: "14 15 * * *"
    - cron: "14 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flight-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python run.py -v daily

      - name: Save price history
        if: always()
        run: |
          git config user.name "flight-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "تحديث الأسعار $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      - name: Package dashboard
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: radar
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
