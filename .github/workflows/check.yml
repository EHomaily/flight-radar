name: فحص الإعدادات

# يعمل تلقائياً عند تعديل config.yaml أو الكود، ويظهر ❌ إن وُجد خطأ في الإعدادات
on:
  push:
    paths: ["config.yaml", "radar/**", "tests/**", "run.py", "requirements.txt"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python run.py check-config
      - run: python -m pytest -q
