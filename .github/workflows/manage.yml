name: إدارة المراقبات

# يعمل عند إرسال نموذج «إضافة أو تعديل مراقبة» أو «حذف مراقبة»
# ولا يقبل إلا النماذج المرسلة من صاحب المستودع.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: flight-radar-config
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'مراقبة') || startsWith(github.event.issue.title, 'حذف مراقبة'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Apply form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/body.md"
          python run.py manage --body-file "$RUNNER_TEMP/body.md" \
            --comment-file "$RUNNER_TEMP/comment.md" --changed-file "$RUNNER_TEMP/changed.txt"

      - name: Save watches
        run: |
          if [ "$(cat "$RUNNER_TEMP/changed.txt")" = "yes" ]; then
            git config user.name "flight-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add watches.yaml
            git commit -m "تحديث المراقبات من النموذج #${{ github.event.issue.number }}"
            git pull --rebase --autostash
            git push
          fi

      - name: Reply, close and run the radar
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          echo "" >> "$RUNNER_TEMP/comment.md"
          echo "📊 [لوحة الرادار](https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/)" >> "$RUNNER_TEMP/comment.md"
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$(cat "$RUNNER_TEMP/changed.txt")" = "yes" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
            gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
